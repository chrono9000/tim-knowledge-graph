name: Synthetic workflow tests
on:
  push:
    branches: [main, step6-materiality-review]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local encryption dependency
        run: python -m pip install -r hosted/requirements-local.txt
      - name: Run Python synthetic tests
        run: python -m unittest discover -s agent/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned local test tools
        working-directory: hosted
        run: npm ci --ignore-scripts --no-fund
      - name: Run hosted and local-runtime synthetic tests
        working-directory: hosted
        run: npm test
